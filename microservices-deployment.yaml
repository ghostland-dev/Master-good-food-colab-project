apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-service
  namespace: goodfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-service
  template:
    metadata:
      labels:
        app: client-service
    spec:
      containers:
      - name: client-service
        image: ghcr.io/stanislasthbd/goodfood/client-service:latest
        ports:
        - containerPort: 8080
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-service.messaging.svc.cluster.local"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: franchise-service
  namespace: goodfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: franchise-service
  template:
    metadata:
      labels:
        app: franchise-service
    spec:
      containers:
      - name: franchise-service
        image: ghcr.io/stanislasthbd/goodfood/FranchiseService:latest
        ports:
        - containerPort: 5000
        env:
        - name: RABBITMQ_HOST
          value: "rabbitmq-service.messaging.svc.cluster.local"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: goodfood
  spec:
    replicas: 1
    selector:
      matchLabels:
        - name: catalogue-service
          image: ghcr.io/stanislasthbd/goodfood/catalogue-service:latest
          ports:
          - containerPort: 8082
          env:
          - name: RABBITMQ_HOST
            value: "rabbitmq-service.messaging.svc.cluster.local"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: goodfood
spec:
  selector:
    app: client-service
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: franchise-service
  namespace: goodfood
spec:
  selector:
    app: franchise-service
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: goodfood
spec:
  selector:
    app: catalogue-service
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
