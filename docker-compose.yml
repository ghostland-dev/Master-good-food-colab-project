  client-db:
    image: postgres
    # restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    networks:
      - shrp-ntwrk
    # volumes:
    #   - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10


