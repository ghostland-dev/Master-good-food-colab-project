#     - shrp-ntwrk

# menu-db:
#   image: mongo
#   ports:
#     - "27017:27017"
#   networks:
#     - shrp-ntwrk

  client-db:
    image: postgres
    restart: always
    env_file:
      - client.env
    ports:
      - "5433:5432"
    networks:
      - shrp-ntwrk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10


  franchise-db:
    image: postgres
    restart: always
    env_file:
      - franchise.env
    ports:
      - "5435:5432"
    networks:
      - shrp-ntwrk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - shrp-ntwrk

#volumes:
#   pgdata:
#  postgres_data:

networks:
  shrp-ntwrk:
    driver: bridge

