services:
  gateway:
    build: ./gateway
    container_name: api_gateway
    restart: always
    ports:
      - "80:80"
    networks:
      - goodfood-network
    depends_on:
      auth-services:
        condition: service_healthy
      menu-services:
        condition: service_healthy
      client-service:
        condition: service_healthy
      franchise-services:
        condition: service_healthy

# auth-services:
#   build:
#     context: auth-service
#     dockerfile: Dockerfile
#   volumes:
#     -./auth-service:/app
#   env_file:
#    -./auth-service/.env
#   networks:
#     - goodfood-network
#   depends_on:
#     auth-db:
#       condition: service_healthy

  menu-service: 
    build: ./catalogue-service
    volumes:
      - ./catalogue-service/:/app
      - /app/node_modules
    ports:
      - "3333:3333"
    env_file:
      - ./catalogue-service/.env
    depends_on:
      menu-mongodb:
        condition: service_healthy

  client-service:
    build:
      context: client-service
      dockerfile: Dockerfile
    volumes:
      - ./client-service:/app
      - /app/node_modules
    env_file:
      - ./client-service/.env
    ports:
      - "3001:3000"
    networks:
      - goodfood-network
    depends_on:
      client-db:
        condition: service_healthy

  franchise-services:
    build:
      context: .
      dockerfile: FranchiseService/Franchise.API/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=franchise-db;Port=5432;Database=franchisedb;Username=franchisedb;Password=franchisedb
    ports:
      - "5000:8080"
    networks:
      - goodfood-network
    depends_on:
      franchise-db:
        condition: service_healthy

# auth-db:
#   image: postgres
#   environment:
#     - POSTGRES_USER=auth
#     - POSTGRES_PASSWORD=postgres
#     - POSTGRES_DB=shrp
#   ports:
#    - "5435:5432"
#   networks:
#     - goodfood-network

  menu-mongodb:
    image: mongo:latest
    env_file:
      - ./catalogue-service/.env
    ports:
      - 27017:27017
    volumes:
      - mongodb_data_container:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  client-db:
    image: postgres
    restart: always
    env_file:
      - client.env
    ports:
      - "5433:5432"
    networks:
      - goodfood-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10


  franchise-db:
    image: postgres
    restart: always
    env_file:
      - franchise.env
    ports:
      - "5435:5432"
    networks:
      - goodfood-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - goodfood-network

volumes:
  mongodb_data_container:

networks:
  goodfood-network:
    driver: bridge

