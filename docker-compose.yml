  client-services:
    build:
      context: client-service
      dockerfile: Dockerfile
    volumes:
      - ./client-service:/app
      - /app/node_modules
    env_file:
      - ./client-service/.env
    ports:
      - "3001:3000"
    networks:
      - shrp-ntwrk
    depends_on:
      client-db:
        condition: service_healthy

# franchise-services:
#   build:
#     context: franchise-service
#     dockerfile: Dockerfile
#   volumes:
#     -./franchise-service:/app
#   env_file:
#    -./franchise-service/.env
#   networks:
#     - shrp-ntwrk
#   depends_on:
#     franchise-db:
#       condition: service_healthy
  franchise-services:
    build:
      context: .
      dockerfile: FranchiseService/Franchise.API/Dockerfile
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=franchise-db;Port=5432;Database=franchisedb;Username=franchisedb;Password=franchisedb
    ports:
      - "5000:8080"
    networks:
      - shrp-ntwrk
    depends_on:
      franchise-db:
        condition: service_healthy

# auth-db:
#   image: postgres
#   environment:
#     - POSTGRES_USER=auth
#     - POSTGRES_PASSWORD=postgres
#     - POSTGRES_DB=shrp
#   ports:
#    - "5435:5432"
