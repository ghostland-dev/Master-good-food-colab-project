services:
gateway-services:
  build:
    context: gateway-service
    dockerfile: Dockerfile
  volumes:
    - ./gateway-service:/app
  env_file:
    - ./gateway-service/.env
  ports:
    - "8080:8080"
  networks:
    - shrp-ntwrk
  depends_on:
    auth-services:
      condition: service_healthy
    menu-services:
      condition: service_healthy
    client-services:
      condition: service_healthy
    franchise-services:
      condition: service_healthy

auth-services:
  build:
    context: auth-service
    dockerfile: Dockerfile
  volumes:
    -./auth-service:/app
  env_file:
   -./auth-service/.env
  networks:
    - shrp-ntwrk
  depends_on:
    auth-db:
      condition: service_healthy

menu-services:
  build:
    context: menu-service
    dockerfile: Dockerfile
  volumes:
    -./menu-service:/app
  env_file:
   -./menu-service/.env
  networks:
    - shrp-ntwrk
  depends_on:
    menu-db:
      condition: service_healthy

client-services:
  build:
    context: client-service
    dockerfile: Dockerfile
  volumes:
    -./client-service:/app
  env_file:
   -./client-service/.env
  networks:
    - shrp-ntwrk
  depends_on:
    client-db:
      condition: service_healthy

franchise-services:
  build:
    context: franchise-service
    dockerfile: Dockerfile
  volumes:
    -./franchise-service:/app
  env_file:
   -./franchise-service/.env
  networks:
    - shrp-ntwrk
  depends_on:
    franchise-db:
      condition: service_healthy

auth-db:
  image: postgresql
  environment:
    - POSTGRES_USER=auth
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=shrp
  ports:
   - "5435:5432"
  networks:
    - shrp-ntwrk

menu-db:
  image: mongo
  ports:
    - "27017:27017"
  networks:
    - shrp-ntwrk

client-db:
  image: postgresql
  environment:
    - POSTGRES_USER=client
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=shrp
  ports:
   - "5433:5432"
  networks:
    - shrp-ntwrk

franchise-db:
  image: postgresql
  environment:
    - POSTGRES_USER=franchise
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=shrp
  ports:
   - "5434:5432"
  networks:
    - shrp-ntwrk

networks:
  shrp-ntwrk:
    driver: bridge
