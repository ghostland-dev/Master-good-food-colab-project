  client-services:
    build:
      context: client-service
      dockerfile: Dockerfile
    volumes:
      - ./client-service:/app
      - /app/node_modules # Évite les conflits de dépendances
    env_file:
      - ./client-service/.env
    ports:
      - "3001:3000"
    networks:
      - shrp-ntwrk
    depends_on:
      client-db:
        condition: service_healthy

