name: CI/CD Service Catalogue avec Docker et Docker Compose


env:
  IMAGE_NAME: ghcr.io/stanislasthbd/goodfood/service-catalogue
  TF_CLI_ARGS_apply: "-auto-approve"
  TF_CLI_ARGS_destroy: "-auto-approve"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths: 
      - "catalogue-service/**"
  pull_request:
    branches:
      - main
    paths: 
      - "catalogue-service/**"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Mise en place de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login sur GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupération des métadonnées
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/stanislasthbd/goodfood/service-catalogue

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/stanislasthbd/goodfood/service-catalogue:latest
          context: ./catalogue-service
          cache-from: type=gha
          cache-to: type=gha,mode=max

