name: CI/CD DevSecOps Pipeline for Franchise Service

on:
  push:
    branches:
      - main
    paths: 
      - "FranchiseService/**"
  pull_request:
    branches:
      - main
    paths:
      - "FranchiseService/**"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/goodfood-maalsi2/goodfood/franchise-service
  TF_CLI_ARGS_apply: "-auto-approve"
  TF_CLI_ARGS_destroy: "-auto-approve"

jobs:

  # 🏗️ Build & Push Docker Image
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # Le répertoire qui contient le code ET le Dockerfile
          context: ./FranchiseService
          # Nom du fichier Dockerfile (s’il s’appelle "Dockerfile", vous pouvez omettre cette ligne)
          file: ./FranchiseService/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Franchise Service for Good Food

            
