name: CI/CD DevSecOps Pipeline for ASP.NET 8 Microservice

on:
  push:
    branches:
      - main
    paths:
      - "FranchiseService/**"
  pull_request:
    branches:
      - main
    paths:
      - "FranchiseService/**"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/franchise-service
  TF_CLI_ARGS_apply: "-auto-approve"
  TF_CLI_ARGS_destroy: "-auto-approve"

jobs:

  # 🏗️ Build & Push Docker Image
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Change Directory
        run: cd FranchiseService

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore FranchiseService/Franchise.API/Franchise.API.csproj

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Publish Application
        run: dotnet publish FranchiseService/Franchise.API/Franchise.API.csproj -c Release -o ./publish

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -f FranchiseService/Franchise.API/Dockerfile .

      - name: Push Docker Image to GHCR
        run: docker push ${{ env.IMAGE_NAME }}:latest

  # 🛡️ Security Scans using Trivy
  container_scanning:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Scan on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  # 🔍 SAST - Static Application Security Testing
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Change Directory
        run: cd FranchiseService
      - name: Run SAST Scan
        uses: github/codeql-action/init@v2
        with:
          languages: csharp
      - run: github/codeql-action/analyze@v2

  # 🛡️ Secret Detection
  secret_detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Change Directory
        run: cd FranchiseService

      - name: Run Secret Detection
        uses: zricethezav/gitleaks-action@v2
        with:
          config-path: ".github/gitleaks.toml"
          fail: "true"

  # 📦 Dependency Scanning
  dependency_scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Change Directory
        run: cd FranchiseService

      - name: Run Dependency Check
        run: dotnet list package --vulnerable

  # 🔬 Dynamic Application Security Testing (DAST)
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Change Directory
        run: cd FranchiseService
      - name: Run OWASP ZAP DAST
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:5000"

  # ✅ Unit & Integration Tests
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Change Directory
        run: cd FranchiseService

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      - name: Run Unit Tests
        run: dotnet test --logger trx --results-directory ./TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: ./TestResults

  # 📊 Code Quality Analysis
  code_quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Change Directory
        run: cd FranchiseService

      - name: Run .NET Code Quality Analysis
        run: dotnet format --verify-no-changes || exit 0

  # 🚀 Terraform Deployment on Azure
  deploy_azure:
    runs-on: ubuntu-latest
    needs: [build, container_scanning, sast, unit_tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Change Directory
        run: cd FranchiseService

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Login to Azure
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: Deploy Infrastructure to Azure
        run: |
          cd terraform/azure
          terraform init
          terraform apply

      - name: Send Discord Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "CI/CD Pipeline",
            "embeds": [{
              "title": "✅ Azure Deployment Successful",
              "description": "The application has been successfully deployed to **Azure** 🚀",
              "color": 3066993
            }]
          }' ${{ secrets.DISCORD_WEBHOOK_URL }}

  # 🚀 Terraform Deployment on AWS
  deploy_aws:
    runs-on: ubuntu-latest
    needs: [build, container_scanning, sast, unit_tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Change Directory
        run: cd FranchiseService

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Infrastructure to AWS
        run: |
          cd terraform/aws
          terraform init
          terraform apply

      - name: Send Discord Notification
        if: success()
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "CI/CD Pipeline",
            "embeds": [{
              "title": "✅ AWS Deployment Successful",
              "description": "The application has been successfully deployed to **AWS** 🚀",
              "color": 3066993
            }]
          }' ${{ secrets.DISCORD_WEBHOOK_URL }}
