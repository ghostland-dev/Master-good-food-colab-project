name: CI/CD DevSecOps Pipeline for Client Service

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    paths: 
      - "client-service/**"
  pull_request:
    branches:
      - main
    paths:
      - "client-service/**"

env:
  IMAGE_NAME: ghcr.io/stanislasthbd/goodfood/client-service
  AZURE_CONTAINER_REGISTRY: myregistry.azurecr.io
  AZURE_RESOURCE_GROUP: my-resource-group
  AZURE_APP_SERVICE: my-client-service
  TF_CLI_ARGS_apply: "-auto-approve"
  TF_CLI_ARGS_destroy: "-auto-approve"


jobs:
  # 🏗️ Build & Push Docker Image
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./client-service
          file: ./client-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Client Service for GoodFood

  # 🛡️ Security Scans using Trivy
  container_scanning:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Run Trivy Scan on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  # 🚀 Déploiement sur Azure avec Terraform
  deploy-azure:
    needs: container_scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
