name: CI/CD Pipeline for GoodFood

on:
  push:
    branches:
      - main
    paths:
      - "client-service/**"
      - "franchise-service/**"
      - "catalogue-service/**"
      - "app-web/**"
  pull_request:
    branches:
      - main

env:
  IMAGE_REGISTRY: ghcr.io/stanislasthbd/goodfood
  AKS_CLUSTER: goodfood-aks
  RESOURCE_GROUP: goodfood-resources

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          for service in client-service franchise-service catalogue-service; do
            docker build -t $IMAGE_REGISTRY/$service:latest $service/
            docker push $IMAGE_REGISTRY/$service:latest
          done

  security_scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy Scan on Docker Images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "$IMAGE_REGISTRY/client-service:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

  deploy:
    needs: [build, security_scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        run: |
          az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER
          kubectl get nodes

      - name: Deploy to AKS
        run: |
          kubectl apply -f rabbitmq-deployment.yaml
          kubectl apply -f microservices-deployment.yaml
          kubectl apply -f api-gateway.yaml
