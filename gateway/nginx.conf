server {
    listen 80;
    server_name localhost;

    # Redirige vers le frontend
    location / {
        proxy_pass http://app-web:3000;
    }

    # Redirige vers l'API menu
    location /api/menu/ {
        proxy_pass http://menu-service:3333/;
    }

    # Redirige vers l'API client
    location /api/client/ {
        proxy_pass http://client-service:3000/;
    }

    # Redirige vers l'API franchise
    location /api/franchise/ {
        proxy_pass http://franchise-service:8080/;
    }

    # Redirige vers l'API auth
    # location /api/auth/ {
    #     proxy_pass http://auth-service:9500/;
    # }

    # Redirige vers RabbitMQ Management UI (optionnel)
    location /rabbitmq/ {
        proxy_pass http://rabbitmq:15672/;
    }
}