apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: goodfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: goodfood
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 80;
        location /client/ {
          proxy_pass http://client-service.goodfood.svc.cluster.local:8080/;
        }
        location /franchise/ {
          proxy_pass http://franchise-service.goodfood.svc.cluster.local:5000/;
        }
        location /catalogue/ {
          proxy_pass http://catalogue-service.goodfood.svc.cluster.local:8082/;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: goodfood
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
